name: Terraform Security Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-ci:
    name: Mandatory Terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: 03-terraform-secure-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: 03-terraform-secure-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov==3.3.28

      - name: Scan Terraform with Checkov
        run: |
          checkov -d . \
            --framework terraform \
            --soft-fail-on CKV_AWS_88,CKV_AWS_135,CKV_AWS_338 \
            --output cli \
            --output json \
            --output-file-path console,checkov-report.json

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudguard-checkov-report
          path: 03-terraform-secure-infrastructure/checkov-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.0'
          scan-type: config
          scan-ref: 03-terraform-secure-infrastructure
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
