name: CloudGuard Application Deployment

on:
  push:
    branches:
      - main
    paths:
      - '04-container-security/**'
      - '.github/workflows/cloudguard-deploy.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudguard-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "911635674505"
  AWS_ROLE_ARN: arn:aws:iam::911635674505:role/CloudGuardGitHubDeploymentRole
  ECR_REPOSITORY: cloudguard-app
  ECS_CLUSTER: cloudguard-cluster
  ECS_SERVICE: cloudguard-api-service
  TASK_FAMILY: cloudguard-api
  CONTAINER_NAME: cloudguard-api

jobs:
  deploy:
    name: Build, Scan and Deploy CloudGuard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          export TOKEN

          python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub")
          }, indent=2))
          PY

          unset TOKEN

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: CloudGuardGitHubDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build CloudGuard image
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            --pull \
            -t cloudguard-app:${IMAGE_TAG} \
            ./04-container-security

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.0'
          scan-type: image
          image-ref: cloudguard-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Authenticate to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Push image to Amazon ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "cloudguard-app:${IMAGE_TAG}" "$IMAGE_URI"
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Retrieve current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > task-definition.json

      - name: Render updated task definition
        run: |
          jq --arg IMAGE "$IMAGE_URI" --arg NAME "$CONTAINER_NAME" '
            (.containerDefinitions[] | select(.name == $NAME).image) = $IMAGE
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-definition.json > task-definition-register.json

          jq -e \
            --arg NAME "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $NAME)' \
            task-definition-register.json > /dev/null

      - name: Register new ECS task definition revision
        run: |
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEFINITION=$NEW_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "Registered: $NEW_TASK_DEFINITION"

      - name: Deploy CloudGuard to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION" \
            --desired-count 1 \
            --region "$AWS_REGION"

      - name: Wait for ECS deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify ECS deployment
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Status:status,
              DesiredCount:desiredCount,
              RunningCount:runningCount,
              TaskDefinition:taskDefinition
            }' \
            --output table

      - name: Deployment summary
        run: |
          echo "CloudGuard deployment completed."
          echo "Image: $IMAGE_URI"
          echo "Task definition: $NEW_TASK_DEFINITION"
