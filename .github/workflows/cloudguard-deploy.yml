name: CloudGuard Application Deployment

on:
  push:
    branches:
      - main
    paths:
      - '04-container-security/**'
      - '03-terraform-secure-infrastructure/cloudguard-containers.json'
      - '.github/workflows/cloudguard-deploy.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudguard-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "911635674505"
  AWS_ROLE_ARN: arn:aws:iam::911635674505:role/CloudGuardGitHubDeploymentRole
  ECR_REPOSITORY: cloudguard-app
  ECS_CLUSTER: cloudguard-cluster
  ECS_SERVICE: cloudguard-api-service
  TASK_FAMILY: cloudguard-api
  CONTAINER_NAME: cloudguard-api

jobs:
  deploy:
    name: Build, Scan and Deploy CloudGuard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: CloudGuardGitHubDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build CloudGuard image
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            --pull \
            -t cloudguard-app:${IMAGE_TAG} \
            ./04-container-security

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.0'
          scan-type: image
          image-ref: cloudguard-app:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Authenticate to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Push image to Amazon ECR
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "cloudguard-app:${IMAGE_TAG}" "$IMAGE_URI"
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Build and validate ECS task definition
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE="03-terraform-secure-infrastructure/cloudguard-containers.json"

          jq --arg IMAGE "$IMAGE_URI" --arg REGION "$AWS_REGION" '
            map(
              .image = $IMAGE
              | if .name == "cloudguard-api" then
                  .logConfiguration.options["awslogs-region"] = $REGION
                else .
                end
            )
          ' "$TEMPLATE" > container-definitions.json

          # Validate container count and security configuration.
          jq -e '
            length == 2
            and ([.[].name] | sort == ["cloudguard-api", "cloudguard-init-tmp"])
            and (any(.[]; .name == "cloudguard-init-tmp" and .user == "0" and .essential == false))
            and (any(.[]; .name == "cloudguard-api"
              and .user == "101"
              and .essential == true
              and .readonlyRootFilesystem == true
              and .privileged == false
              and (.linuxParameters.capabilities.drop | index("ALL") != null)
              and (.dependsOn | any(.containerName == "cloudguard-init-tmp" and .condition == "SUCCESS"))
              and (.portMappings | any(.containerPort == 8080))
            ))
          ' container-definitions.json

          # Build a complete Fargate task definition.
          jq -n \
            --arg family "$TASK_FAMILY" \
            --arg executionRole "arn:aws:iam::${AWS_ACCOUNT_ID}:role/cloudguard-ecs-execution-role" \
            --arg taskRole "arn:aws:iam::${AWS_ACCOUNT_ID}:role/cloudguard-ecs-task-role" \
            --slurpfile containers container-definitions.json \
            '{
              family: $family,
              requiresCompatibilities: ["FARGATE"],
              networkMode: "awsvpc",
              cpu: "256",
              memory: "512",
              executionRoleArn: $executionRole,
              taskRoleArn: $taskRole,
              runtimePlatform: {
                operatingSystemFamily: "LINUX",
                cpuArchitecture: "X86_64"
              },
              volumes: [
                {
                  name: "nginx-tmp"
                }
              ],
              containerDefinitions: $containers[0],
              tags: [
                {
                  key: "Project",
                  value: "CloudGuard"
                },
                {
                  key: "Environment",
                  value: "lab"
                }
              ]
            }' > task-definition-register.json

          jq -e '
            .family == "cloudguard-api"
            and .networkMode == "awsvpc"
            and (.containerDefinitions | length == 2)
            and (.volumes | any(.name == "nginx-tmp"))
          ' task-definition-register.json

          echo "Complete ECS task definition generated and validated."

      - name: Register new ECS task definition revision
        run: |
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEFINITION=$NEW_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "Registered: $NEW_TASK_DEFINITION"

      - name: Deploy CloudGuard to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION" \
            --desired-count 1 \
            --region "$AWS_REGION"

      - name: Wait for ECS deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify ECS deployment
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Status:status,
              DesiredCount:desiredCount,
              RunningCount:runningCount,
              TaskDefinition:taskDefinition
            }' \
            --output table

      - name: Deployment summary
        run: |
          echo "CloudGuard deployment completed."
          echo "Image: $IMAGE_URI"
          echo "Task definition: $NEW_TASK_DEFINITION"
