<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CloudGuard secure cloud infrastructure monitoring project.">
    <title>CloudGuard | Secure Cloud Infrastructure</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b1220;
            color: #e5edf8;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 720px;
            margin: 24px;
            padding: 48px;
            border: 1px solid #263750;
            border-radius: 16px;
            background: #111d30;
        }
        .label {
            color: #38d9a9;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 { font-size: 42px; margin: 18px 0; }
        p { color: #b8c7da; line-height: 1.7; }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            border: 1px solid #226b58;
            border-radius: 6px;
            color: #57e3b5;
            font-size: 14px;
        }
        footer {
            margin-top: 40px;
            color: #8294aa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main>
        <div class="label">Cloud Security Engineering</div>
        <h1>CloudGuard</h1>
        <p>
            A secure cloud infrastructure project demonstrating
            container hardening, network isolation, least-privilege
            access, encrypted services and centralized monitoring
            on Amazon Web Services.
        </p>
        <div class="status">Application online</div>
        <footer>CloudGuard | AWS ECS Fargate Infrastructure</footer>
    </main>
</body>
</html>
